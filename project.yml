# Especificación XcodeGen del proyecto iOS/macOS de FacturaInvent 2.
# Regenerar el .xcodeproj con:  xcodegen generate
name: FacturaInvent2

options:
  bundleIdPrefix: Miguel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.1.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.20

targets:
  FacturaInvent2:
    type: application
    platform: iOS
    sources:
      - path: FacturaInvent2
        excludes:
          - "README.md"
          - "Catalyst.entitlements"
    dependencies:
      - package: GoogleSignIn
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Miguel.FacturaInvent2
        DEVELOPMENT_TEAM: WFLZKCYTXB
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        # Solo Mac Catalyst necesita entitlements (sandbox + red saliente)
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FacturaInvent2/Catalyst.entitlements
    info:
      path: FacturaInvent2/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # El servidor del supermercado es http:// en la red local (sin TLS)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # OAuth de Google (mismo client ID que v1)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Gmail
            CFBundleURLSchemes:
              - com.googleusercontent.apps.279081770593-vvj79v3s7onugv26mslcfnv40sdpe77p
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
