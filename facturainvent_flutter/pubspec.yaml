name: facturainvent
description: "FacturaInvent — Flutter port. Importa facturas XML DIAN, gestiona productos y exporta a XLSX."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Localization
  intl: any

  # Persistence
  shared_preferences: ^2.3.3

  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3

  # XML parsing
  xml: ^6.5.0

  # XLSX (MIT, sin dependencias nativas)
  excel: ^4.0.6

  # Archivos
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  cross_file: ^0.3.4+2
  file_selector: ^1.0.3

  # Utilities
  collection: ^1.18.0
  uuid: ^4.5.1

  # Desktop
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
